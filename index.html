<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bufet Dou Assessors · Des de 1985</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap">
<style>
/* Plantilla "asesorías" moderna de Mimmic: hero con vídeo, fotos grandes, áreas en acordeón y calendario fiscal en línea de tiempo.
   Colores y fuentes llegan del JSON del cliente (marcaNueva.*). Fotos y vídeos: media.* */
:root{--primario:#1E4D40;--tinta:#0F1F1A;--claro:#DCE8E0;--papel:#F7F8F5;--acento:#E9A23B;--blanco:#fff;--gris:#5b6b66;--linea:#d9e1dc;
  --titulos:system-ui,sans-serif;--serif:Georgia,serif;--r:18px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--papel:#0d1714;--blanco:#13201c;--tinta:#e8efeb;--gris:#a5b5ae;--linea:#24352f;--claro:#17302a;color-scheme:dark}}
:root[data-theme="dark"]{--papel:#0d1714;--blanco:#13201c;--tinta:#e8efeb;--gris:#a5b5ae;--linea:#24352f;--claro:#17302a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 17px/1.6 var(--titulos);-webkit-font-smoothing:antialiased}
.g{max-width:1240px;margin:0 auto;padding-inline:24px}
h1,h2,h3{font-family:var(--titulos);margin:0;line-height:1.05;letter-spacing:-.03em;text-wrap:balance}
h1{font-size:clamp(2.5rem,5.2vw,4.4rem);font-weight:700}
h2{font-size:clamp(2rem,4vw,3.4rem);font-weight:700}
h3{font-size:1.35rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--acento);outline-offset:3px}
.aviso{background:var(--acento);color:#1a1405;font-size:.82rem;text-align:center;padding:6px 16px}
.btn{display:inline-flex;align-items:center;gap:10px;font:600 1rem var(--titulos);padding:15px 24px;border-radius:999px;text-decoration:none;border:1.5px solid currentColor;cursor:pointer;background:none;color:inherit;transition:background .2s,color .2s}
.btn.a{background:var(--acento);border-color:var(--acento);color:#1a1405}
.btn.a:hover{background:#f4b553}
.btn svg{width:18px;height:18px}
.media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(135deg,var(--primario),#2d6b59)}

/* Cabecera sobre el vídeo */
header{position:fixed;left:0;right:0;top:var(--top,0px);z-index:30;color:#fff;transition:background .3s,box-shadow .3s}
header .g{transition:min-height .3s}
header.solid{background:rgba(15,31,26,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px -20px rgba(0,0,0,.6)}
header.solid .g{min-height:68px}
.burger{order:3;display:none;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:transparent;color:#fff;cursor:pointer;position:relative;flex:none}
.burger i,.burger i::before,.burger i::after{position:absolute;left:50%;top:50%;width:18px;height:1.5px;background:currentColor;transform:translate(-50%,-50%);transition:transform .25s,background .25s}
.burger i::before,.burger i::after{content:"";left:0;transform:translateY(-6px)}
.burger i::after{transform:translateY(6px)}
header.open .burger i{background:transparent}
header.open .burger i::before{transform:rotate(45deg)}
header.open .burger i::after{transform:rotate(-45deg)}
header .g{display:flex;align-items:center;gap:28px;min-height:84px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none}
.logo svg{width:40px;height:40px}
.logo b{display:block;font-weight:700;font-size:1.3rem;letter-spacing:-.02em;line-height:1}
.logo b{white-space:nowrap}
@media (max-width:420px){.logo b{font-size:1.08rem}.logo svg{width:34px;height:34px}}
.logo b em{font:400 1.15em/1 var(--serif);font-style:normal;letter-spacing:0;margin-left:.22em}
.logo small{display:block;font-size:.78rem;opacity:.8;margin-top:3px}
nav.menu{display:flex;gap:26px;margin-left:auto;font-size:.95rem;font-weight:500}
nav.menu a{text-decoration:none;opacity:.9}
nav.menu a:hover{opacity:1;text-decoration:underline;text-underline-offset:6px}
.util{display:flex;align-items:center;gap:12px}
.idioma{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.idioma button{font:600 .78rem var(--titulos);background:none;border:0;color:#fff;padding:7px 11px;cursor:pointer}
.idioma button[aria-pressed="true"]{background:#fff;color:var(--primario)}
.util .tel{font-weight:600;text-decoration:none;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:8px 16px;white-space:nowrap}
@media (max-width:1020px){
  .burger{display:block}.util{margin-left:auto}
  nav.menu{display:none;position:absolute;left:0;right:0;top:100%;flex-direction:column;gap:0;margin:0;padding:8px 24px 20px;background:#0F1F1A}
  nav.menu a{padding:14px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:1.1rem}
  header.open{background:#0F1F1A}
  header.open nav.menu{display:flex}
}
@media (max-width:560px){.util .tel{display:none}}

/* Hero */
.hero{position:relative;min-height:min(92vh,860px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--primario)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(13,40,33,.92) 0%,rgba(13,40,33,.7) 45%,rgba(13,40,33,.25) 100%)}
.hero .g{position:relative;z-index:2;width:100%;padding-top:140px;padding-bottom:64px;display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:end}
.hero p.lead{font-size:1.2rem;max-width:50ch;margin-top:24px;opacity:.9}
.hero .acc{display:flex;flex-wrap:wrap;gap:12px;margin-top:36px}
.prox{justify-self:end;width:min(100%,360px);background:rgba(255,255,255,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);border-radius:var(--r);padding:22px 24px}
.prox .t{font-size:.85rem;opacity:.85}
.prox .f{display:flex;align-items:baseline;gap:12px;margin:6px 0 4px}
.prox .f b{font:400 3.4rem/1 var(--serif)}
.prox .f span{font-size:1rem}
.prox .d{font-size:.95rem}
.prox .c{display:inline-block;margin-top:14px;background:var(--acento);color:#1a1405;font-weight:600;font-size:.82rem;border-radius:999px;padding:4px 12px}
@media (max-width:900px){.hero .g{grid-template-columns:1fr;padding-top:120px}.prox{justify-self:start}}

/* Franja de confianza */
.franja{background:var(--blanco);border-bottom:1px solid var(--linea)}
.franja ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr)}
.franja li{padding:26px 20px;border-left:1px solid var(--linea);display:flex;flex-direction:column;gap:2px}
.franja li:first-child{border-left:0;padding-left:0}
.franja b{font:400 2rem/1.1 var(--serif)}
.franja span{color:var(--gris);font-size:.9rem}
.estr{color:var(--acento);letter-spacing:1px;font-size:.85rem}
@media (max-width:760px){.franja ul{grid-template-columns:1fr 1fr}.franja li{border-left:0;padding-left:0;border-top:1px solid var(--linea)}.franja li:nth-child(-n+2){border-top:0}}

section.s{padding:104px 0}
.cab{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:end;margin-bottom:48px}
.cab p{color:var(--gris);max-width:46ch;justify-self:end}
@media (max-width:800px){.cab{grid-template-columns:1fr}.cab p{justify-self:start}}

/* Perfiles con foto */
.perfiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.perfil{position:relative;border-radius:var(--r);overflow:hidden;min-height:520px;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:28px;isolation:isolate;background:linear-gradient(160deg,#2d6b59,var(--primario))}
.perfil img{z-index:-2;transition:transform .6s ease}
.perfil:hover img{transform:scale(1.04)}
.perfil::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,40,33,.05) 15%,rgba(13,40,33,.55) 45%,rgba(13,40,33,.96) 78%)}
.perfil h3{font-size:1.8rem}
.perfil p{margin:8px 0 14px;opacity:.9}
.perfil ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.perfil li{font-size:.8rem;border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:4px 10px}
@media (max-width:900px){.perfiles{grid-template-columns:1fr}.perfil{min-height:380px}}

/* Especialidad principal (C.foco) */
.foco .tag{display:inline-block;background:color-mix(in srgb,var(--acento) 22%,transparent);color:var(--tinta);font-weight:600;font-size:.85rem;border-radius:999px;padding:6px 14px;margin-bottom:18px}
.foco .cab{align-items:start}
.foco .cab p{font-size:1.08rem}
.servs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.servs li{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.servs li:hover{border-color:var(--primario);transform:translateY(-2px)}
.servs .n{font:400 2.2rem/1 var(--serif);color:var(--acento)}
.servs h3{font-size:1.35rem}
.servs p{color:var(--gris);margin:0}
.foco .pie{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;background:var(--primario);color:#fff;border-radius:var(--r);padding:28px 32px}
.foco .pie p{margin:0;font:400 clamp(1.4rem,2.4vw,1.9rem)/1.2 var(--serif);max-width:32ch}
@media (max-width:900px){.servs{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.servs{grid-template-columns:1fr}.foco .pie{padding:24px}}

/* Áreas en acordeón */
.areas-s{background:var(--primario);color:#fff}
.areas-s .g{display:grid;grid-template-columns:1fr 1.4fr;gap:64px}
.areas-s .intro p{opacity:.8;margin-top:20px;max-width:40ch}
.areas-s .intro{position:sticky;top:40px;align-self:start}
details{border-top:1px solid rgba(255,255,255,.22)}
details:last-child{border-bottom:1px solid rgba(255,255,255,.22)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:20px;padding:26px 0;font-size:clamp(1.3rem,2.4vw,1.9rem);font-weight:600;letter-spacing:-.02em}
summary::-webkit-details-marker{display:none}
summary i{flex:none;width:40px;height:40px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4);position:relative;transition:background .2s,transform .3s}
summary i::before,summary i::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:1.5px;background:#fff;transform:translate(-50%,-50%)}
summary i::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .3s}
details[open] summary i{background:var(--acento);border-color:var(--acento)}
details[open] summary i::after{transform:translate(-50%,-50%) rotate(0)}
details p{opacity:.85;padding:0 60px 26px 0;max-width:60ch}
@media (max-width:900px){.areas-s .g{grid-template-columns:1fr;gap:32px}.areas-s .intro{position:static}}

/* Banda con vídeo */
.banda{position:relative;min-height:440px;display:flex;align-items:center;color:#fff;overflow:hidden;background:var(--tinta)}
.banda::after{content:"";position:absolute;inset:0;background:rgba(10,24,20,.6)}
.banda .g{position:relative;z-index:2;width:100%}
.banda p{font:400 clamp(2.2rem,5vw,4.2rem)/1.08 var(--serif);max-width:20ch;letter-spacing:-.01em}

/* Calendario en línea de tiempo */
.linea{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.linea::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--linea)}
.linea li{position:relative;padding:40px 24px 0 0}
.linea li::before{content:"";position:absolute;top:0;left:0;width:20px;height:20px;border-radius:50%;background:var(--papel);border:2px solid var(--primario)}
.linea li.ya::before{background:var(--acento);border-color:var(--acento);box-shadow:0 0 0 6px color-mix(in srgb,var(--acento) 25%,transparent)}
.linea b{display:block;font:400 2.6rem/1 var(--serif)}
.linea .m{display:block;color:var(--gris);font-size:.9rem;margin:6px 0 12px}
.linea .mod{display:block;font-size:.82rem;color:var(--gris);margin-top:4px;font-variant-numeric:tabular-nums}
.nota{color:var(--gris);font-size:.85rem;margin-top:36px}
@media (max-width:800px){.linea{grid-template-columns:1fr;gap:28px;padding-left:36px}.linea::before{left:9px;right:auto;top:0;bottom:0;width:2px;height:auto}.linea li{padding:0}.linea li::before{left:-36px}}

/* Historia */
.historia .g{display:grid;grid-template-columns:1.05fr 1fr;gap:72px;align-items:center}
.historia .foto{position:relative;aspect-ratio:4/5;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,var(--claro),var(--primario))}
.historia .ano{font:400 clamp(5rem,12vw,9rem)/.9 var(--serif);color:var(--primario);letter-spacing:-.03em}
.historia h2{margin-top:12px}
.historia p{color:var(--gris);margin-top:20px;max-width:52ch}
.historia ul{list-style:none;margin:28px 0 0;padding:0}
.historia li{padding:14px 0 14px 34px;border-top:1px solid var(--linea);position:relative}
.historia li::before{content:"";position:absolute;left:0;top:50%;width:16px;height:16px;transform:translateY(-50%);border-radius:50%;background:var(--claro);box-shadow:inset 0 0 0 5px var(--primario)}
@media (max-width:900px){.historia .g{grid-template-columns:1fr;gap:40px}.historia .foto{aspect-ratio:4/3}}

/* Opiniones */
.opin{background:var(--claro)}
.citas{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:24px}
.citas figure{margin:0;background:var(--blanco);border-radius:var(--r);padding:36px}
.citas blockquote{margin:14px 0 0;font:400 clamp(1.6rem,2.6vw,2.2rem)/1.2 var(--serif)}
.citas figcaption{margin-top:20px;color:var(--gris);font-size:.92rem}

/* Equipo */
.equipo{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.persona{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r);padding:24px}
.persona .ini{width:72px;height:72px;border-radius:50%;background:var(--primario);color:#fff;display:grid;place-items:center;font-weight:700;font-size:1.3rem;letter-spacing:.02em}
.persona b{display:block;margin-top:18px;font-size:1.1rem}
.persona span{color:var(--gris);font-size:.9rem}

/* Contacto */
.contacto{background:var(--tinta);color:#fff}
:root[data-theme="dark"] .contacto,:root:not([data-theme="light"]) .contacto{background:#0F1F1A}
.contacto .g{display:grid;grid-template-columns:1fr 1fr;gap:64px}
.contacto .lead{opacity:.8;margin-top:18px;max-width:42ch}
.contacto .telg{display:block;font:400 clamp(2.4rem,5vw,4rem)/1 var(--serif);text-decoration:none;margin:36px 0 10px;color:var(--acento)}
.contacto dl{margin:32px 0 0;display:grid;grid-template-columns:auto 1fr;gap:10px 24px}
.contacto dt{opacity:.65}
.contacto dd{margin:0}
.mapa{margin-top:32px;width:100%;aspect-ratio:16/9;border:0;border-radius:var(--r);filter:grayscale(.4)}
form{background:#fff;color:#0F1F1A;border-radius:var(--r);padding:36px;align-self:start}
form h3{font-size:1.6rem;margin-bottom:8px}
label{display:block;font-size:.88rem;font-weight:600;margin:16px 0 6px}
input,select,textarea{width:100%;font:400 1rem var(--titulos);padding:13px 14px;border:1px solid #d3dbd7;border-radius:12px;background:#F7F8F5;color:#0F1F1A}
textarea{min-height:110px;resize:vertical}
.perf{display:flex;gap:8px;flex-wrap:wrap}
.perf label{margin:0;font-weight:500;font-size:.9rem;border:1px solid #d3dbd7;border-radius:999px;padding:8px 14px;cursor:pointer}
.perf input{position:absolute;opacity:0;width:1px;height:1px}
.perf input:checked+span{font-weight:600}
.perf label:has(input:checked){background:#1E4D40;color:#fff;border-color:#1E4D40}
.perf label:has(input:focus-visible){outline:3px solid var(--acento);outline-offset:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;font-weight:400;color:#5b6b66;margin-top:18px}
.chk input{width:auto;margin-top:4px}
form .btn{margin-top:22px;width:100%;justify-content:center;background:#1E4D40;border-color:#1E4D40;color:#fff}
.ok{margin-top:12px;font-weight:600;min-height:1.5em;color:#1E4D40}
@media (max-width:900px){.contacto .g{grid-template-columns:1fr;gap:40px}form{padding:24px}}

footer{background:var(--tinta);color:rgba(255,255,255,.65);font-size:.85rem;padding:0 0 110px}
:root:not([data-theme="light"]) footer{background:#0F1F1A}
footer .g{display:flex;flex-wrap:wrap;gap:12px 28px;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);padding-top:28px}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer .cred{flex-basis:100%;font-size:.75rem;opacity:.7}

.barra{position:fixed;left:12px;right:12px;bottom:12px;display:none;gap:8px;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.barra a{flex:1;text-align:center;padding:15px 8px;font-weight:600;text-decoration:none;border-radius:999px;background:#fff;color:#1E4D40;box-shadow:0 10px 30px -10px rgba(0,0,0,.4)}
.barra a.a{background:var(--acento);color:#1a1405}
@media (max-width:700px){.barra{display:flex}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.perfil img{transition:none}}
</style>
</head>

    </div>
  </div></section>

  ${C.opiniones&&C.opiniones.length?`<section class="s opin"><div class="g">
    <div class="cab"><h2>${u.opinH}</h2></div>
    <div class="citas">${C.opiniones.map(o=>`<figure><span class="estr" aria-label="5/5">★★★★★</span><blockquote>${esc(o.texto)}</blockquote><figcaption>${esc(o.autor)}, ${u.via} ${esc(o.fuente)}</figcaption></figure>`).join('')}</div>
  </div></section>`:''}

  <section class="s"><div class="g">
    <div class="cab"><h2>${u.equipoH}</h2></div>
    <div class="equipo">${C.equipo.map(p=>`<div class="persona"><div class="ini">${esc(ini(p.nombre))}</div><b>${esc(p.nombre)}</b><span>${esc(t(p.cargo))}</span></div>`).join('')}</div>
  </div></section>

  <section class="s contacto" id="contacte"><div class="g">
    <div>
      <h2>${u.contH}</h2>
      <p class="lead">${u.contP}</p>
      <a class="telg" href="tel:${k.telefonoLink}">${esc(k.telefono)}</a>
      <dl><dt>${u.dir}</dt><dd>${esc(k.direccion)}<br>${esc(k.cp)}</dd><dt>${u.hor}</dt><dd>${esc(t(k.horario))}</dd></dl>
      <iframe class="mapa" title="${u.mapa}" loading="lazy" src="https://maps.google.com/maps?q=${encodeURIComponent(k.direccion+', '+k.cp)}&z=16&output=embed"></iframe>
    </div>
    <form id="f" novalidate>
      <h3>${u.formH}</h3>
      <label for="fn">${u.nom}</label><input id="fn" autocomplete="name">
      <label for="fm">${u.mail}</label><input id="fm" autocomplete="email">
      <label>${u.perfil}</label><div class="perf">${u.opts.map((o,i)=>`<label><input type="radio" name="pf" ${i===0?'checked':''}><span>${o}</span></label>`).join('')}</div>
      ${F?`<label for="ft">${u.tema}</label><select id="ft">${[t(F.menu),...C.areas.map(x=>t(x.titulo)),u.altres].map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}
      <label for="fc">${u.msg}</label><textarea id="fc"></textarea>
      <label class="chk"><input type="checkbox"> <span>${u.rgpd}</span></label>
      <button class="btn" type="submit">${u.enviar}</button>
      <p class="ok" role="status"></p>
    </form>
  </div></section>
  </main>
  <footer><div class="g">
    <span>© ${hoy.getFullYear()} ${esc(C.razonSocial)}</span>
    <nav aria-label="Legal">${u.legal.map(x=>`<a href="#">${x}</a>`).join('')}${k.intranet?`<a href="${esc(k.intranet)}">${u.cli}</a>`:''}</nav>
    <span>Web: Mimmic</span>
    ${md.creditos?`<span class="cred">${esc(md.creditos)}</span>`:''}
  </div></footer>
  <div class="barra"><a href="tel:${k.telefonoLink}">${u.llamar}</a><a class="a" href="#contacte">${u.cita}</a></div>`;
  const hd=document.querySelector('header'), bg=hd.querySelector('.burger');
  bg.onclick=()=>{const o=hd.classList.toggle('open');bg.setAttribute('aria-expanded',o)};
  hd.querySelectorAll('nav.menu a').forEach(a=>a.onclick=()=>{hd.classList.remove('open');bg.setAttribute('aria-expanded',false)});
  pos();
  document.querySelectorAll('.idioma button').forEach(b=>b.onclick=()=>{L=b.dataset.l;try{localStorage.setItem('lang',L)}catch(e){};render()});
  document.getElementById('f').onsubmit=e=>{e.preventDefault();e.target.querySelector('.ok').textContent=u.enviado};
}
function pos(){
  const hd=document.querySelector('header'), av=document.querySelector('.aviso');
  if(!hd)return;
  const y=scrollY, h=av?av.offsetHeight:0;
  document.documentElement.style.setProperty('--top',Math.max(0,h-y)+'px');
  hd.classList.toggle('solid',y>40);
}
addEventListener('scroll',pos,{passive:true}); addEventListener('resize',pos);
render();
</script>
</body>
</html>
